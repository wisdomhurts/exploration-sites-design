<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>document.documentElement.classList.add('js');</script>
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
{%- if noindex %}
<meta name="robots" content="noindex">
{%- endif %}
<meta name="theme-color" content="#1A101F">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:site_name" content="Exploration Sites">
<meta property="og:image" content="{{ site.url }}{{ ogImage | default: '/images/og-image.png' }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ site.url }}{{ ogImage | default: '/images/og-image.png' }}">

<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="/fonts/source-serif-4-300.woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
<script type="importmap">
{
  "imports": {
    "three": "/assets/three/r169/three.module.min.js",
    "three/addons/": "/assets/three/addons/"
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "ProfessionalService",
      "@id": "{{ site.url }}/#org",
      "name": "Exploration Sites",
      "url": "{{ site.url }}",
      "logo": "{{ site.url }}/images/logo-512.png",
      "image": "{{ site.url }}/images/og-image.png",
      "description": "Investor-relations and investor-visualization studio for junior mining companies. The translation layer between your deposit and the capital markets.",
      "email": "info@explorationsites.com",
      "telephone": "+1-604-688-9997",
      "priceRange": "$$$",
      "areaServed": "Worldwide",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Victoria",
        "addressRegion": "BC",
        "addressCountry": "CA"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 48.4284,
        "longitude": -123.3656
      },
      "knowsAbout": [
        "Mining investor relations",
        "Investor presentations",
        "Geological visualization",
        "GIS cartography",
        "Mineral exploration communications"
      ],
      "sameAs": [
        "https://www.linkedin.com/company/exploration-sites/",
        "https://x.com/explorationsite",
        "https://www.youtube.com/@ExplorationSites1",
        "https://www.instagram.com/explorationsites"
      ]
    },
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": "{{ site.url }}",
      "name": "Exploration Sites",
      "publisher": { "@id": "{{ site.url }}/#org" }
    }
  ]
}
</script>
{% if pageSchema %}
<script type="application/ld+json">
{{ pageSchema | replace: "%SITE%", site.url }}
</script>
{% endif %}
