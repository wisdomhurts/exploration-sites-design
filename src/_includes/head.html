<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="theme-color" content="#1A101F">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:site_name" content="Exploration Sites">
<meta property="og:image" content="{{ site.url }}{{ ogImage | default: '/images/og-default.jpg' }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ site.url }}{{ ogImage | default: '/images/og-default.jpg' }}">

<link rel="preload" as="font" type="font/woff2" href="/fonts/source-serif-4-300.woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "ProfessionalService",
      "@id": "{{ site.url }}/#org",
      "name": "Exploration Sites",
      "url": "{{ site.url }}",
      "logo": "{{ site.url }}/images/logo-512.png",
      "image": "{{ site.url }}/images/og-default.jpg",
      "description": "Investor-relations and investor-visualization studio for junior mining companies. The communication layer between your deposit and the capital markets.",
      "email": "info@explorationsites.com",
      "telephone": "+1-604-688-9997",
      "priceRange": "$$$",
      "areaServed": "Worldwide",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Victoria",
        "addressRegion": "BC",
        "addressCountry": "CA"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 48.4284,
        "longitude": -123.3656
      },
      "knowsAbout": [
        "Mining investor relations",
        "Investor presentations",
        "Geological visualization",
        "GIS cartography",
        "Mineral exploration communications"
      ],
      "sameAs": [
        "https://www.linkedin.com/company/exploration-sites/",
        "https://x.com/explorationsite",
        "https://www.youtube.com/@ExplorationSites1",
        "https://www.instagram.com/explorationsites"
      ],
      "review": [
        {
          "@type": "Review",
          "author": { "@type": "Person", "name": "Stephanie Hansen", "jobTitle": "Director, Marketing & IR", "worksFor": "Snowline Gold" },
          "reviewBody": "Extremely knowledgeable about the mining industry, very responsive & committed to getting it right. They helped elevate our branding & digital presence to better reflect the stage our company has grown to."
        },
        {
          "@type": "Review",
          "author": { "@type": "Person", "name": "Will Robinson", "jobTitle": "VP Exploration", "worksFor": "West Red Lake Gold" },
          "reviewBody": "Accurate and informative images are essential in communicating exploration and mining news effectively. Dorian and his team handle this important job with precision and speed. They do far more than simply create images."
        },
        {
          "@type": "Review",
          "author": { "@type": "Person", "name": "Chris Paul", "jobTitle": "CEO & Director", "worksFor": "Hercules Metals" },
          "reviewBody": "When it comes to 2D and 3D maps, cross-sections and figures, they really are the industry standard. I'm a GIS background myself, so I have a lot of respect for their quality of work."
        }
      ]
    },
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": "{{ site.url }}",
      "name": "Exploration Sites",
      "publisher": { "@id": "{{ site.url }}/#org" }
    }
  ]
}
</script>
{% if pageSchema %}
<script type="application/ld+json">
{{ pageSchema }}
</script>
{% endif %}
