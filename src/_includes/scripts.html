  <script>
    // Desktop mega menu — tabs + open/close (hover, click, keyboard, focus)
    (function () {
      var wrapper = document.querySelector('.mega-menu-wrapper');
      var trigger = wrapper && wrapper.querySelector('.mega-menu-trigger');
      if (!wrapper || !trigger) return;

      var tabs = Array.prototype.slice.call(wrapper.querySelectorAll('.mega-menu-tab'));
      var panels = Array.prototype.slice.call(wrapper.querySelectorAll('.mega-menu-tab-panel'));

      // --- Tab selection -------------------------------------------------
      function selectTab(tab, focusIt) {
        if (!tab) return;
        var tabId = tab.getAttribute('data-tab');
        tabs.forEach(function (t) {
          var on = t === tab;
          t.classList.toggle('is-active', on);
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          t.setAttribute('tabindex', on ? '0' : '-1');
        });
        panels.forEach(function (p) {
          var on = p.id === 'panel-' + tabId;
          p.classList.toggle('is-active', on);
          if (on) { p.removeAttribute('hidden'); } else { p.setAttribute('hidden', ''); }
        });
        if (focusIt) tab.focus();
      }

      tabs.forEach(function (tab, i) {
        // Switch on hover (desktop), click, and focus (keyboard Tab into list).
        tab.addEventListener('mouseenter', function () { selectTab(tab, false); });
        tab.addEventListener('click', function () { var href = tab.getAttribute('data-href'); if (href) { window.location.href = href; } else { selectTab(tab, false); } });
        tab.addEventListener('focus', function () { selectTab(tab, false); });
        // Roving-tabindex arrow-key navigation within the tablist.
        tab.addEventListener('keydown', function (e) {
          var idx = null;
          if (e.key === 'ArrowDown' || e.key === 'ArrowRight') idx = (i + 1) % tabs.length;
          else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') idx = (i - 1 + tabs.length) % tabs.length;
          else if (e.key === 'Home') idx = 0;
          else if (e.key === 'End') idx = tabs.length - 1;
          if (idx !== null) { e.preventDefault(); selectTab(tabs[idx], true); }
        });
      });

      // --- Open / close --------------------------------------------------
      function openMenu() {
        wrapper.classList.add('is-open');
        trigger.setAttribute('aria-expanded', 'true');
      }
      function closeMenu(returnFocus) {
        wrapper.classList.remove('is-open');
        trigger.setAttribute('aria-expanded', 'false');
        if (returnFocus) trigger.focus();
      }
      function isOpen() { return wrapper.classList.contains('is-open'); }

      // Click toggles the menu (touch + mouse).
      trigger.addEventListener('click', function (e) {
        e.preventDefault();
        if (isOpen()) closeMenu(false); else openMenu();
      });
      // Enter / Space open it explicitly (button click already fires, but make
      // Space reliable and move focus into the active tab on open).
      trigger.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          if (!isOpen()) { openMenu(); }
          var active = wrapper.querySelector('.mega-menu-tab.is-active') || tabs[0];
          if (active) active.focus();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (!isOpen()) openMenu();
          var first = wrapper.querySelector('.mega-menu-tab.is-active') || tabs[0];
          if (first) first.focus();
        }
      });

      // Escape closes and returns focus to the trigger.
      wrapper.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && isOpen()) { e.preventDefault(); closeMenu(true); }
      });

      // Close on outside click.
      document.addEventListener('click', function (e) {
        if (isOpen() && !wrapper.contains(e.target)) closeMenu(false);
      });

      // Close when focus leaves the whole menu (e.g. Tab out of the last link).
      wrapper.addEventListener('focusout', function (e) {
        if (isOpen() && !wrapper.contains(e.relatedTarget)) closeMenu(false);
      });
    })();

    // Mobile nav panel — open/close, focus trap, services accordion
    (function () {
      var hamburger = document.querySelector('.nav-hamburger');
      var overlay = document.querySelector('.nav-mobile-overlay');
      var panel = document.querySelector('.nav-mobile-panel');
      if (!hamburger || !overlay || !panel) return;
      var closeBtn = panel.querySelector('.nav-mobile-close button');

      function focusable() {
        return Array.prototype.slice.call(
          panel.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])')
        ).filter(function (el) {
          return el.offsetParent !== null || el === document.activeElement;
        });
      }

      function openPanel() {
        overlay.classList.add('is-open');
        panel.classList.add('is-open');
        hamburger.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
        if (closeBtn) closeBtn.focus();
      }
      function closePanel(returnFocus) {
        overlay.classList.remove('is-open');
        panel.classList.remove('is-open');
        hamburger.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
        if (returnFocus) hamburger.focus();
      }
      function isOpen() { return panel.classList.contains('is-open'); }

      hamburger.addEventListener('click', openPanel);
      overlay.addEventListener('click', function () { closePanel(false); });
      if (closeBtn) closeBtn.addEventListener('click', function () { closePanel(true); });

      document.addEventListener('keydown', function (e) {
        if (!isOpen()) return;
        if (e.key === 'Escape') { e.preventDefault(); closePanel(true); return; }
        if (e.key === 'Tab') {
          var items = focusable();
          if (!items.length) return;
          var first = items[0], last = items[items.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault(); last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault(); first.focus();
          }
        }
      });

      // Services accordion inside the mobile panel
      var accTrigger = panel.querySelector('.nav-mobile-acc-trigger');
      var accBody = panel.querySelector('.nav-mobile-acc-body');
      if (accTrigger && accBody) {
        accTrigger.addEventListener('click', function () {
          var expanded = accTrigger.getAttribute('aria-expanded') === 'true';
          accTrigger.setAttribute('aria-expanded', expanded ? 'false' : 'true');
          if (expanded) { accBody.setAttribute('hidden', ''); } else { accBody.removeAttribute('hidden'); }
        });
      }
    })();

    // Scroll-triggered entry for marked elements
    (function () {
      var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced || !('IntersectionObserver' in window)) {
        document.querySelectorAll('[data-reveal]').forEach(function (el) { el.classList.add('is-revealed'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-revealed');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      document.querySelectorAll('[data-reveal]').forEach(function (el) { io.observe(el); });
    })();

    // Animated count-up numbers
    (function () {
      var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var els = document.querySelectorAll('[data-count-to]');
      if (!els.length) return;
      function format(val, decimals, prefix, suffix) {
        if (!isFinite(val) || val < 0) val = 0; /* never paint a negative/NaN frame */
        var n = decimals > 0 ? val.toFixed(decimals) : Math.round(val).toString();
        if (decimals === 0) {
          n = n.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
        return (prefix || '') + n + (suffix || '');
      }
      function animate(el) {
        var target = parseFloat(el.getAttribute('data-count-to'));
        var decimals = parseInt(el.getAttribute('data-count-decimals') || '0', 10);
        var prefix = el.getAttribute('data-count-prefix') || '';
        var suffix = el.getAttribute('data-count-suffix') || '';
        if (prefersReduced || isNaN(target)) {
          el.textContent = format(target, decimals, prefix, suffix);
          return;
        }
        var duration = 1400;
        var start = performance.now();
        function tick(now) {
          var t = Math.min(1, (now - start) / duration);
          var eased = 1 - Math.pow(1 - t, 3);
          el.textContent = format(target * eased, decimals, prefix, suffix);
          if (t < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }
      if (!('IntersectionObserver' in window)) {
        els.forEach(animate);
        return;
      }
      var countIo = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            animate(entry.target);
            countIo.unobserve(entry.target);
          }
        });
      }, { threshold: 0.4 });
      els.forEach(function (el) { countIo.observe(el); });
    })();

    // Scroll-pinned case: track current step
    (function () {
      var pinned = document.querySelector('[data-pinned]');
      if (!pinned) return;
      var steps = pinned.querySelectorAll('.pinned-case-step');
      var indicator = pinned.querySelector('[data-current-step]');
      if (!steps.length || !indicator) return;
      if (!('IntersectionObserver' in window)) {
        steps.forEach(function (s) { s.classList.add('is-current'); });
        return;
      }
      var pio = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            steps.forEach(function (s) { s.classList.remove('is-current'); });
            entry.target.classList.add('is-current');
            var step = entry.target.getAttribute('data-step');
            if (step) indicator.textContent = step;
          }
        });
      }, { rootMargin: '-40% 0px -40% 0px', threshold: 0 });
      steps.forEach(function (s) { pio.observe(s); });
    })();

    // Timeline activation
    (function () {
      var timelines = document.querySelectorAll('[data-timeline]');
      if (!timelines.length) return;
      if (!('IntersectionObserver' in window)) {
        timelines.forEach(function (t) { t.classList.add('is-active'); });
        return;
      }
      var tio = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-active');
            tio.unobserve(entry.target);
          }
        });
      }, { threshold: 0.25 });
      timelines.forEach(function (t) { tio.observe(t); });
    })();

    // Before/after compare slider
    (function () {
      var containers = document.querySelectorAll('.compare');
      if (!containers.length) return;
      containers.forEach(function (c) {
        var handle = c.querySelector('.compare-handle');
        if (!handle) return;
        var isDragging = false;
        function setPos(pct) {
          pct = Math.max(0, Math.min(100, pct));
          c.style.setProperty('--compare-pos', pct + '%');
          handle.setAttribute('aria-valuenow', Math.round(pct));
        }
        function fromClientX(x) {
          var rect = c.getBoundingClientRect();
          setPos(((x - rect.left) / rect.width) * 100);
        }
        function onDown(e) {
          isDragging = true;
          c.style.cursor = 'ew-resize';
          if (e.touches) fromClientX(e.touches[0].clientX);
          else fromClientX(e.clientX);
          e.preventDefault();
        }
        function onMove(e) {
          if (!isDragging) return;
          if (e.touches) fromClientX(e.touches[0].clientX);
          else fromClientX(e.clientX);
        }
        function onUp() { isDragging = false; c.style.cursor = ''; }
        handle.addEventListener('mousedown', onDown);
        handle.addEventListener('touchstart', onDown, { passive: false });
        window.addEventListener('mousemove', onMove);
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('mouseup', onUp);
        window.addEventListener('touchend', onUp);
        c.addEventListener('click', function (e) {
          if (e.target === handle || handle.contains(e.target)) return;
          fromClientX(e.clientX);
        });
        handle.addEventListener('keydown', function (e) {
          var current = parseFloat(handle.getAttribute('aria-valuenow')) || 50;
          var step = e.shiftKey ? 10 : 2;
          if (e.key === 'ArrowLeft') { setPos(current - step); e.preventDefault(); }
          else if (e.key === 'ArrowRight') { setPos(current + step); e.preventDefault(); }
          else if (e.key === 'Home') { setPos(0); e.preventDefault(); }
          else if (e.key === 'End') { setPos(100); e.preventDefault(); }
        });
      });
    })();

    // Lightbox — images (selected work / map galleries) and YouTube videos (films).
    // Ported from the service-detail pages. No-ops on any page without a
    // #work-lightbox element, so it is safe site-wide.
    (function () {
      var lb = document.getElementById('work-lightbox');
      if (!lb) return;
      var img = lb.querySelector('.lightbox-img');
      var vid = lb.querySelector('.lightbox-video');
      var cap = lb.querySelector('.lightbox-cap');
      function show() { lb.hidden = false; document.body.style.overflow = 'hidden'; }
      function openImg(full, caption, alt) {
        if (!img) return;
        img.src = full; img.alt = alt || caption || ''; img.hidden = false;
        if (vid) { vid.hidden = true; vid.innerHTML = ''; }
        if (cap) cap.textContent = caption || '';
        show();
      }
      function openVideo(id, caption) {
        if (!vid) return;
        vid.innerHTML = '<iframe src="https://www.youtube.com/embed/' + id +
          '?autoplay=1&rel=0" title="' + (caption || 'Video') +
          '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
        vid.hidden = false;
        if (img) { img.hidden = true; img.src = ''; }
        if (cap) cap.textContent = caption || '';
        show();
      }
      function close() {
        lb.hidden = true;
        if (img) img.src = '';
        if (vid) vid.innerHTML = '';
        document.body.style.overflow = '';
      }
      document.querySelectorAll('[data-lightbox]').forEach(function (el) {
        el.addEventListener('click', function () {
          var v = el.getAttribute('data-video');
          if (v) { openVideo(v, el.getAttribute('data-caption')); }
          else { var t = el.querySelector('img'); openImg(el.getAttribute('data-full'), el.getAttribute('data-caption'), t ? t.alt : ''); }
        });
      });
      lb.addEventListener('click', function (e) {
        if (e.target === lb || e.target.classList.contains('lightbox-close')) close();
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !lb.hidden) close(); });
    })();
  </script>
