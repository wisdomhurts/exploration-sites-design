  <script>
    // Desktop mega menu — tabs + open/close (hover, click, keyboard, focus)
    (function () {
      var wrapper = document.querySelector('.mega-menu-wrapper');
      var trigger = wrapper && wrapper.querySelector('.mega-menu-trigger');
      if (!wrapper || !trigger) return;

      var tabs = Array.prototype.slice.call(wrapper.querySelectorAll('.mega-menu-tab'));
      var panels = Array.prototype.slice.call(wrapper.querySelectorAll('.mega-menu-tab-panel'));

      // --- Tab selection -------------------------------------------------
      function selectTab(tab, focusIt) {
        if (!tab) return;
        var tabId = tab.getAttribute('data-tab');
        tabs.forEach(function (t) {
          var on = t === tab;
          t.classList.toggle('is-active', on);
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          t.setAttribute('tabindex', on ? '0' : '-1');
        });
        panels.forEach(function (p) {
          var on = p.id === 'panel-' + tabId;
          p.classList.toggle('is-active', on);
          if (on) { p.removeAttribute('hidden'); } else { p.setAttribute('hidden', ''); }
        });
        if (focusIt) tab.focus();
      }

      // A tab's click goes to the first page in its panel (Investor Maps ->
      // Locators & Area Plays, etc.), read from the panel so it follows any
      // reordering. Hover and focus still just preview the panel. On touch, the
      // first tap on an inactive tab only selects it (a tap fires mouseenter and
      // click together), so the cards can be seen; a second tap navigates.
      var lastPointer = 'mouse';
      function firstHref(tab) {
        var p = document.getElementById('panel-' + tab.getAttribute('data-tab'));
        var a = p && p.querySelector('a[href]');
        return a ? a.getAttribute('href') : null;
      }

      tabs.forEach(function (tab, i) {
        tab.addEventListener('pointerdown', function (e) {
          lastPointer = e.pointerType;
          tab.dataset.wasActive = tab.classList.contains('is-active') ? '1' : '';
        });
        tab.addEventListener('mouseenter', function () { selectTab(tab, false); });
        tab.addEventListener('click', function () {
          var touchFirstTap = lastPointer === 'touch' && !tab.dataset.wasActive;
          lastPointer = 'mouse';
          selectTab(tab, false);
          if (touchFirstTap) return;
          var href = firstHref(tab);
          if (href) window.location.href = href;
        });
        tab.addEventListener('focus', function () { selectTab(tab, false); });
        // Roving-tabindex arrow-key navigation within the tablist.
        tab.addEventListener('keydown', function (e) {
          var idx = null;
          if (e.key === 'ArrowDown' || e.key === 'ArrowRight') idx = (i + 1) % tabs.length;
          else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') idx = (i - 1 + tabs.length) % tabs.length;
          else if (e.key === 'Home') idx = 0;
          else if (e.key === 'End') idx = tabs.length - 1;
          if (idx !== null) { e.preventDefault(); selectTab(tabs[idx], true); }
        });
      });

      // --- Open / close --------------------------------------------------
      function openMenu() {
        wrapper.classList.add('is-open');
        trigger.setAttribute('aria-expanded', 'true');
      }
      function closeMenu(returnFocus) {
        wrapper.classList.remove('is-open');
        trigger.setAttribute('aria-expanded', 'false');
        if (returnFocus) trigger.focus();
      }
      function isOpen() { return wrapper.classList.contains('is-open'); }

      // Click toggles the menu (touch + mouse).
      trigger.addEventListener('click', function (e) {
        e.preventDefault();
        if (isOpen()) closeMenu(false); else openMenu();
      });
      // Enter / Space open it explicitly (button click already fires, but make
      // Space reliable and move focus into the active tab on open).
      trigger.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          if (!isOpen()) { openMenu(); }
          var active = wrapper.querySelector('.mega-menu-tab.is-active') || tabs[0] || wrapper.querySelector('.mm-link');
          if (active) active.focus();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (!isOpen()) openMenu();
          var first = wrapper.querySelector('.mega-menu-tab.is-active') || tabs[0] || wrapper.querySelector('.mm-link');
          if (first) first.focus();
        }
      });

      // Escape closes and returns focus to the trigger.
      wrapper.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && isOpen()) { e.preventDefault(); closeMenu(true); }
      });

      // Close on outside click.
      document.addEventListener('click', function (e) {
        if (isOpen() && !wrapper.contains(e.target)) closeMenu(false);
      });

      // Close when focus leaves the whole menu (e.g. Tab out of the last link).
      wrapper.addEventListener('focusout', function (e) {
        if (isOpen() && !wrapper.contains(e.relatedTarget)) closeMenu(false);
      });
    })();

    // Mobile nav panel — open/close, focus trap, services accordion
    (function () {
      var hamburger = document.querySelector('.nav-hamburger');
      var overlay = document.querySelector('.nav-mobile-overlay');
      var panel = document.querySelector('.nav-mobile-panel');
      if (!hamburger || !overlay || !panel) return;
      var closeBtn = panel.querySelector('.nav-mobile-close button');

      function focusable() {
        return Array.prototype.slice.call(
          panel.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])')
        ).filter(function (el) {
          return el.offsetParent !== null || el === document.activeElement;
        });
      }

      var previousOverflow = '';
      function openPanel() {
        previousOverflow = document.body.style.overflow;
        panel.inert = false;
        panel.removeAttribute('aria-hidden');
        overlay.classList.add('is-open');
        panel.classList.add('is-open');
        hamburger.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
        if (closeBtn) closeBtn.focus();

      function closePanel(returnFocus) {
        overlay.classList.remove('is-open');
        panel.classList.remove('is-open');
        hamburger.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = previousOverflow;
        if (returnFocus || panel.contains(document.activeElement)) hamburger.focus();
        panel.inert = true;
        panel.setAttribute('aria-hidden', 'true');

      window.addEventListener('resize', function () {

        if (e.key === 'Escape') { e.preventDefault(); closePanel(true); return; }

      // trigger targets its body by aria-controls, so any number of accordions work.
      Array.prototype.slice.call(panel.querySelectorAll('.nav-mobile-acc-trigger')).forEach(function (accTrigger) {

        if (!accBody) return;

      document.querySelectorAll('[data-reveal]').forEach(function (el) { io.observe(el); });
    })();

    // Stat numbers are static by design (2026-07): an understated brand doesn't
    // perform its numbers. The markup carries the final values; no count-up.

    // Scroll-pinned case: track current step
    (function () {
      var pinned = document.querySelector('[data-pinned]');
      if (!pinned) return;
      var steps = pinned.querySelectorAll('.pinned-case-step');
      var indicator = pinned.querySelector('[data-current-step]');
      if (!steps.length || !indicator) return;
      if (!('IntersectionObserver' in window)) {
        steps.forEach(function (s) { s.classList.add('is-current'); });
        return;
      }
      var pio = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            steps.forEach(function (s) { s.classList.remove('is-current'); });
            entry.target.classList.add('is-current');
            var step = entry.target.getAttribute('data-step');
            if (step) indicator.textContent = step;
          }
        });
      }, { rootMargin: '-40% 0px -40% 0px', threshold: 0 });
      steps.forEach(function (s) { pio.observe(s); });
    })();

    // Timeline activation
    (function () {
      var timelines = document.querySelectorAll('[data-timeline]');
      if (!timelines.length) return;
      if (!('IntersectionObserver' in window)) {
        timelines.forEach(function (t) { t.classList.add('is-active'); });
        return;
      }
      var tio = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-active');
            tio.unobserve(entry.target);
          }
        });
      }, { threshold: 0.25 });
      timelines.forEach(function (t) { tio.observe(t); });
    })();

    // Before/after compare slider
    (function () {
      var containers = document.querySelectorAll('.compare');
      if (!containers.length) return;
      containers.forEach(function (c) {
        var handle = c.querySelector('.compare-handle');
        if (!handle) return;
        var isDragging = false;
        function setPos(pct) {
          pct = Math.max(0, Math.min(100, pct));
          c.style.setProperty('--compare-pos', pct + '%');
          handle.setAttribute('aria-valuenow', Math.round(pct));
        }
        function fromClientX(x) {
          var rect = c.getBoundingClientRect();
          setPos(((x - rect.left) / rect.width) * 100);
        }
        function onDown(e) {
          isDragging = true;
          c.style.cursor = 'ew-resize';
          if (e.touches) fromClientX(e.touches[0].clientX);
          else fromClientX(e.clientX);
          e.preventDefault();
        }
        function onMove(e) {
          if (!isDragging) return;
          if (e.touches) fromClientX(e.touches[0].clientX);
          else fromClientX(e.clientX);
        }

        handle.addEventListener('touchstart', onDown, { passive: false });
        window.addEventListener('mousemove', onMove);
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('mouseup', onUp);
        window.addEventListener('touchend', onUp);
        c.addEventListener('click', function (e) {
          if (e.target === handle || handle.contains(e.target)) return;
          fromClientX(e.clientX);
        });
        handle.addEventListener('keydown', function (e) {
          var current = parseFloat(handle.getAttribute('aria-valuenow')) || 50;
          var step = e.shiftKey ? 10 : 2;
          if (e.key === 'ArrowLeft') { setPos(current - step); e.preventDefault(); }
          else if (e.key === 'ArrowRight') { setPos(current + step); e.preventDefault(); }
          else if (e.key === 'Home') { setPos(0); e.preventDefault(); }
          else if (e.key === 'End') { setPos(100); e.preventDefault(); }
        });
      });
    })();

    // Lightbox — images (selected work / map galleries) and YouTube videos (films).
    // Ported from the service-detail pages. No-ops on any page without a
    // #work-lightbox element, so it is safe site-wide.
    (function () {
      var lb = document.getElementById('work-lightbox');
      if (!lb) return;
      var img = lb.querySelector('.lightbox-img');
      var vid = lb.querySelector('.lightbox-video');
      var cap = lb.querySelector('.lightbox-cap');
      var closeBtn = lb.querySelector('.lightbox-close');
      var lastTrigger = null;
      var group = [], gi = -1; // current image gallery + index, for prev/next paging

      // Promote the shared lightbox to a proper modal dialog (A11Y-03): role/aria-modal,
      // focus-in on open, Tab focus-trap while open, focus-restore to the trigger on close.
      lb.setAttribute('role', 'dialog');
      lb.setAttribute('aria-modal', 'true');
      lb.setAttribute('aria-label', 'Media viewer');
      if (closeBtn && !closeBtn.getAttribute('aria-label')) closeBtn.setAttribute('aria-label', 'Close');

      // Prev/next paging controls, created once and reused (hidden for single items / video).
      var prevBtn = document.createElement('button');
      prevBtn.type = 'button'; prevBtn.className = 'lightbox-nav lightbox-prev';
      prevBtn.setAttribute('aria-label', 'Previous map'); prevBtn.innerHTML = '&#8249;';
      var nextBtn = document.createElement('button');
      nextBtn.type = 'button'; nextBtn.className = 'lightbox-nav lightbox-next';
      nextBtn.setAttribute('aria-label', 'Next map'); nextBtn.innerHTML = '&#8250;';
      prevBtn.hidden = true; nextBtn.hidden = true;
      lb.appendChild(prevBtn); lb.appendChild(nextBtn);
      prevBtn.addEventListener('click', function (e) { e.stopPropagation(); nav(-1); });
      nextBtn.addEventListener('click', function (e) { e.stopPropagation(); nav(1); });

      function focusables() {
        return Array.prototype.slice.call(
          lb.querySelectorAll('button, a[href], iframe, [tabindex]:not([tabindex="-1"])')
        ).filter(function (el) { return el === closeBtn || el.offsetParent !== null; });
      }
      function show() {
        lb.hidden = false;
        document.body.style.overflow = 'hidden';
        if (closeBtn) closeBtn.focus();
      }
      // Featured maps carry a short write-up in data-note, shown under the caption.
      function setImg(full, caption, alt, note) {
        if (!img) return;
        img.src = full; img.alt = alt || caption || ''; img.hidden = false;
        if (vid) { vid.hidden = true; vid.innerHTML = ''; }
        if (cap) {
          cap.textContent = caption || '';
          if (note) {
            var n = document.createElement('span');
            n.className = 'lightbox-note'; n.textContent = note;
            cap.appendChild(n);
          }
        }
      }
      function openImg(full, caption, alt, note) { setImg(full, caption, alt, note); show(); }
      // Advance within the current gallery (wraps around); keeps the lightbox open.
      function nav(delta) {
        if (group.length < 2) return;
        gi = (gi + delta + group.length) % group.length;
        var el = group[gi];
        lastTrigger = el;
        var t = el.querySelector('img');
        setImg(el.getAttribute('data-full'), el.getAttribute('data-caption'), t ? t.alt : '', el.getAttribute('data-note'));
      }
      function openVideo(id, caption) {
        if (!vid) return;
        vid.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id +
          '?autoplay=1&rel=0" title="' + (caption || 'Video') +
          '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
        vid.hidden = false;
        if (img) { img.hidden = true; img.src = ''; }
        if (cap) cap.textContent = caption || '';
        show();
      }
      function close() {
        lb.hidden = true;
        if (img) img.src = '';
        if (vid) vid.innerHTML = '';
        document.body.style.overflow = '';
        group = []; gi = -1; prevBtn.hidden = true; nextBtn.hidden = true;
        if (lastTrigger) { lastTrigger.focus(); lastTrigger = null; }
      }
      document.addEventListener('click', function (e) {
        var el = e.target.closest('[data-lightbox]');
        if (!el) return;
        lastTrigger = el;
        var v = el.getAttribute('data-video');
        if (v) {
          if (window.esTrack) esTrack('Video played', { video: el.getAttribute('data-caption') || v });
          group = []; gi = -1; prevBtn.hidden = true; nextBtn.hidden = true; openVideo(v, el.getAttribute('data-caption')); return;
        }
        if (window.esTrack) esTrack('Image enlarged', { page: location.pathname.replace(/\.html$/, '') || '/' });
        // Build the image gallery from the sibling image-lightboxes in the same container
        // (e.g. every map in the currently-shown category), so you can page through them.
        group = Array.prototype.slice.call((el.parentNode || document).querySelectorAll('[data-lightbox][data-full]'))
          .filter(function (n) { return n.offsetParent !== null; });
        gi = group.indexOf(el);
        var multi = group.length > 1 && gi !== -1;
        prevBtn.hidden = !multi; nextBtn.hidden = !multi;
        var t = el.querySelector('img');
        openImg(el.getAttribute('data-full'), el.getAttribute('data-caption'), t ? t.alt : '', el.getAttribute('data-note'));
      });
      lb.addEventListener('click', function (e) {
        if (e.target === lb || e.target.classList.contains('lightbox-close')) close();
      });
      lb.addEventListener('keydown', function (e) {
        if (e.key !== 'Tab') return;
        var f = focusables();
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      });
      document.addEventListener('keydown', function (e) {
        if (lb.hidden) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowLeft') { nav(-1); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { nav(1); e.preventDefault(); }
      });
    })();

<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  // Vercel records each page view's full URL, query string included (verified 2026-10-13).
  // Query strings here can carry personal or confidential data — HighLevel's booking
  // widget forwards its own URL parameters to /booking-confirmed.html, a Stripe redirect
  // can add ?session_id=, and links from email campaigns can prefill name/email — so
  // keep only campaign tags and the program choice, and drop everything else.
  window.va('beforeSend', function (event) {
    try {
      var u = new URL(event.url);
      var keep = new URLSearchParams();
      u.searchParams.forEach(function (v, k) {
        if (/^utm_(source|medium|campaign|term|content)$/.test(k) || k === 'ref' || (k === 'program' && /^(cadence|active|full)$/.test(v)) || (k === 'desk' && /^(explorer|developer|producer)$/.test(v))) keep.append(k, v);
      });
      var qs = keep.toString();
      event.url = u.origin + u.pathname + (qs ? '?' + qs : '');
    } catch (e) {}
    return event;
  });

  // Custom events (the conversions). Anonymous like page views: event names plus where
  // on the site it happened. Never put names, emails or form contents in event data.
  // Ad visitors: when this page view came from a tagged campaign link, add the campaign to
  // every event on it (Vercel's UTM reports need a paid add-on; event data doesn't).
  var esCampaign = (function () { try { return new URLSearchParams(location.search).get('utm_campaign') || ''; } catch (e) { return ''; } })().slice(0, 40);
  window.esTrack = function (name, data) {
    data = data || {};
    if (esCampaign) data.campaign = esCampaign;
    try { window.va('event', { name: name, data: data }); } catch (e) {}
  };
  if (esCampaign) window.esTrack('Campaign landing', { page: location.pathname.replace(/\.html$/, '') || '/' });
  (function () {
    var page = location.pathname.replace(/\.html$/, '').replace(/\/index$/, '/') || '/';
    function spot(el) {
      if (el.closest('nav, .site-nav, .mega-menu, header')) return 'nav';
      if (el.closest('footer')) return 'footer';
      if (el.closest('.hero, .hero--page')) return 'hero';
      if (el.closest('.nrmp-tiers, .nrmp-invoice-note, .compliance-note')) return 'pricing';
      if (el.closest('.cta-section, .cta, .launch-cta')) return 'closing cta';
      return 'body';
    }
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var href = a.getAttribute('href') || '';
      if (/(^|\/)book\.html(\?|#|$)/.test(href)) { var pm = href.match(/program=(cadence|active|full)/); return esTrack('Book call click', { page: page, spot: spot(a), tier: pm ? pm[1] : '' }); }
      if (/^mailto:/i.test(href)) return esTrack('Email click', { page: page });
      if (/^tel:/i.test(href)) return esTrack('Phone click', { page: page });
      if (/\/decks\/[^/]+\.pdf/i.test(href)) return esTrack('Deck opened', { deck: href.split('/').pop().replace(/\.pdf.*$/i, '') });
      if (a.classList.contains('site-card') && a.hostname !== location.hostname) return esTrack('Client site visit', { site: a.hostname.replace(/^www\./, '') });
    }, true);
    document.addEventListener('submit', function (e) {
      var f = e.target;
      if (f && f.matches && f.matches('form[action="/api/checkout"]')) {
        var p = f.querySelector('[name="program"]');
        esTrack('Checkout started', { tier: p ? p.value : 'unknown' });
      }
    }, true);
    // Which sections a visitor reaches (pages with a sales story only), once each per view,
    // so the drop-off point shows up as the last section most people see.
    if ('IntersectionObserver' in window && /^\/(news-release-map-program|engagement|services)?$/.test(page)) {
      var seen = {};
      var so = new IntersectionObserver(function (en) {
        en.forEach(function (x) {
          if (!x.isIntersecting) return;
          var h = x.target.querySelector('h1, h2');
          var name = (h ? (h.innerText || h.textContent) : '').replace(/\s+/g, ' ').trim().slice(0, 48) || 'section';
          if (seen[name]) return;
          seen[name] = 1;
          esTrack('Section seen', { page: page, section: name });
          so.unobserve(x.target);
        });
      }, { rootMargin: '0px 0px -40% 0px', threshold: 0 });
      Array.prototype.forEach.call(document.querySelectorAll('main section, section.hero'), function (el) { so.observe(el); });
    }
    // Engaged time: seconds with the tab visible, reported at 15, 30, 60 and 120 s.
    (function () {
      var marks = [15, 30, 60, 120], secs = 0;
      var t = setInterval(function () {
        if (document.visibilityState !== 'visible') return;
        secs++;
        if (secs === marks[0]) { esTrack('Engaged ' + marks.shift() + 's', { page: page }); if (!marks.length) clearInterval(t); }
      }, 1000);
    })();
    // How far visitors read: pricing reached (Map Program page) and 75% of any page, once per view.
    if ('IntersectionObserver' in window) {
      var tiers = document.querySelector('.nrmp-tiers');
      if (tiers) {
        var io = new IntersectionObserver(function (en) {
          if (en.some(function (x) { return x.isIntersecting; })) { esTrack('Pricing seen', { page: page }); io.disconnect(); }
        }, { threshold: 0.3 });
        io.observe(tiers);
      }
    }
    var deep = false;
    window.addEventListener('scroll', function () {
      if (deep) return;
      var h = document.documentElement.scrollHeight - window.innerHeight;
      if (h > 400 && window.scrollY / h >= 0.75) { deep = true; esTrack('Read 75%', { page: page }); }
    }, { passive: true });
    if (/^\/booking-confirmed/.test(location.pathname)) esTrack('Call booked');
    if (/^\/checkout-success/.test(location.pathname)) esTrack('Checkout completed', { plan: 'map program' });
    if (/^\/desk-welcome/.test(location.pathname)) {
      var dk = new URLSearchParams(location.search).get('desk');
      esTrack('Checkout completed', { plan: /^(explorer|developer|producer)$/.test(dk) ? dk + ' desk' : 'desk' });
    }
  })();

<!-- Local-currency prices. Prices are CAD in the source (<span class="px" data-cad>);
     visitors in the US see USD, in Australia AUD, in Canada CAD, elsewhere USD — from
     /api/geo (country only, nothing stored), overridable with the .fx-switch buttons.
     Fixed rates + the same rounding as the Stripe currency_options, so the price on the
     page is the price at checkout. Rates live in prices.json "fx". -->
<script>
  (function () {
    var px = document.querySelectorAll('.px');
    var switches = document.querySelectorAll('.fx-switch');
    if (!px.length) return;
    var FX = {{ prices.fx | json }};
    var CUR = { CAD: { sym: '$', name: 'Canadian dollars' }, USD: { sym: 'US$', name: 'US dollars' }, AUD: { sym: 'A$', name: 'Australian dollars' } };
    var BY_COUNTRY = { CA: 'CAD', US: 'USD', AU: 'AUD' };
    function clean(v) { var s = v < 100 ? 5 : v < 1000 ? 10 : v < 5000 ? 50 : 500; return Math.round(v / s) * s; }
    function amount(cad, c) { return c === 'CAD' ? cad : clean(cad * FX[c]); }
    function apply(c) {
      if (!CUR[c]) c = 'CAD';
      px.forEach(function (el) { el.textContent = CUR[c].sym + amount(+el.getAttribute('data-cad'), c).toLocaleString('en-US'); });
      document.querySelectorAll('.fx-code').forEach(function (el) { el.textContent = c; });
      document.querySelectorAll('.fx-name').forEach(function (el) { el.textContent = CUR[c].name; });
      switches.forEach(function (sw) {
        sw.hidden = false;
        sw.querySelectorAll('button[data-cur]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-cur') === c ? 'true' : 'false'); });
      });
      document.documentElement.setAttribute('data-currency', c);
    }
    function store(k, v, session) { try { (session ? sessionStorage : localStorage).setItem(k, v); } catch (e) {} }
    function read(k, session) { try { return (session ? sessionStorage : localStorage).getItem(k); } catch (e) { return null; } }
    switches.forEach(function (sw) {
      sw.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-cur]');
        if (!b) return;
        var c = b.getAttribute('data-cur');
        store('es-currency', c);
        apply(c);
        if (window.esTrack) esTrack('Currency switched', { to: c });
      });
    });
    var chosen = read('es-currency');
    if (chosen) return apply(chosen);
    var guessed = read('es-currency-geo', true);
    if (guessed) return apply(guessed);
    apply('CAD');
    fetch('/api/geo').then(function (r) { return r.json(); }).then(function (d) {
      var c = BY_COUNTRY[d.country] || (d.country ? 'USD' : 'CAD');
      store('es-currency-geo', c, true);
      if (!read('es-currency')) apply(c);
    }).catch(function () {});
  })();
</script>
