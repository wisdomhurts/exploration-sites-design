{%- comment -%} Client testimonials (approved, attributed). Used on the homepage and the Montage case study; set testimonialsLabel before including to change the heading. {%- endcomment -%}
    <section class="testimonials page">
      <div class="testimonials-lede">
        <div class="section-label">{{ testimonialsLabel | default: "Their words" }}</div>
      </div>
      <div class="testimonials-grid">
        <figure class="testimonial">
          <blockquote class="testimonial-quote">Extremely knowledgeable about the mining industry, very responsive &amp; committed to getting it right. They helped elevate our branding &amp; digital presence to better reflect the stage our company has grown to.</blockquote>
          <figcaption class="testimonial-bottom">
            <div>
              <cite class="testimonial-name">Stephanie Hansen</cite>
              <div class="testimonial-role">Director, Marketing &amp; IR &mdash; Snowline</div>
              <p class="testimonial-fact">Branding, investor maps &amp; website</p>
            </div>
            <img src="{{ 'images/clients/snowline.avif' | logoSm }}" width="320" height="243" alt="" class="testimonial-logo">
          </figcaption>
        </figure>
        <figure class="testimonial">
          <blockquote class="testimonial-quote">Accurate and informative images are essential in communicating exploration and mining news effectively. Dorian and his team handle this important job with precision and speed. They do far more than simply create images.</blockquote>
          <figcaption class="testimonial-bottom">
            <div>
              <cite class="testimonial-name">Will Robinson</cite>
              <div class="testimonial-role">VP Exploration &mdash; West Red Lake</div>
              <p class="testimonial-fact">~10 maps/month for news releases</p>
              <a class="testimonial-program-link" href="news-release-map-program.html">That cadence is a program <span aria-hidden="true">&rarr;</span></a>
            </div>
            <img src="{{ 'images/clients/wrlg.avif' | logoSm }}" width="320" height="147" alt="" class="testimonial-logo">
          </figcaption>
        </figure>
        <figure class="testimonial">
          <blockquote class="testimonial-quote">When it comes to 2D and 3D maps, cross-sections and figures, they really are the industry standard. I&rsquo;m a GIS background myself, so I have a lot of respect for their quality of work.</blockquote>
          <figcaption class="testimonial-bottom">
            <div>
              <cite class="testimonial-name">Chris Paul</cite>
              <div class="testimonial-role">CEO &amp; Director &mdash; Hercules Metals</div>
              <p class="testimonial-fact">Maps, sections &amp; conference booth</p>
            </div>
            <img src="{{ 'images/clients/hercules.avif' | logoSm }}" width="320" height="158" alt="" class="testimonial-logo">
          </figcaption>
        </figure>
      </div>
    </section>
