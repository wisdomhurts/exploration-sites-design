name: Hourly quote refresh

# Keeps every page that shows a stock quote / market cap up to date and
# consistent, every hour. Fetches live prices, rewrites the source HTML
# (clients table + Montage case-study figures), commits, and deploys.

on:
  schedule:
    - cron: "0 * * * *"      # top of every hour (UTC)
  workflow_dispatch: {}       # also runnable on demand from the Actions tab

concurrency:
  group: hourly-quotes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: pip install --quiet yfinance

      - name: Fetch quotes + sync every page
        run: python scripts/update-client-quotes.py

      - name: Commit refreshed numbers (only if something changed)
        continue-on-error: true
        run: |
          git config user.name "es-quote-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Must list EVERY file update-client-quotes.py writes. Anything missing
          # still reaches production (the deploy step below runs from this same
          # working tree) but never lands in the repo, so the source goes stale and
          # local builds silently regress the live numbers. proof.json did exactly
          # that: the repo sat at marketCapB 81 while production served 87.
          git add src/clients.html src/case-study-montage.html src/case-studies.html \
                  src/index.html src/_data/proof.json
          if git diff --cached --quiet; then
            echo "No quote changes this hour."
          else
            git commit -m "chore(quotes): hourly refresh [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel deploy --prod --yes --token "$VERCEL_TOKEN"
